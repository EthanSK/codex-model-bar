name: Check and package app
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Test
        run: swift test --jobs 2 --scratch-path .build.noindex
      - name: Check isolated Claude setup
        run: python3 Tests/setup_claude_test.py
      - name: Build universal app and verify its actual loader
        run: CODEX_MODEL_BAR_SIGN_ID=- CODEX_MODEL_BAR_ARCH=universal zsh scripts/build-app.sh --no-install
      - uses: actions/upload-artifact@v4
        with:
          name: codex-model-bar-prebuilt
          path: |
            build.noindex/CodexModelBar-prebuilt.zip
            build.noindex/build-receipt.json
          if-no-files-found: error
          retention-days: 7
