# Releases use a disposable GitHub-hosted Mac. — GPT-6.1 Sol
name: Publish signed app
on:
  push:
    branches: [main]
    paths: ['Sources/**', 'Tests/**', 'Resources/**', 'scripts/**', 'Package.*', 'VERSION', 'BUILD_NUMBER', 'release-config.json', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signed-app-release
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/check.yml
  release:
    needs: build
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CODE_SIGN_IDENTITY: 'Developer ID Application: Ethan Sarif-Kattan (T34G959ZG8)'
      NOTARY_PROFILE: ReleaseCI
      SPARKLE_ACCOUNT: com.ethansk.codex-model-bar
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: codex-model-bar-prebuilt
          path: ${{ runner.temp }}/prebuilt.noindex
      - name: Prepare verified Sparkle signing tools
        run: |
          curl --fail --location https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz -o "$RUNNER_TEMP/Sparkle.tar.xz"
          echo '1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27  '"$RUNNER_TEMP/Sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/Sparkle.noindex"
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/Sparkle.noindex"
          echo "SPARKLE_TOOLS=$RUNNER_TEMP/Sparkle.noindex/bin" >> "$GITHUB_ENV"
      - name: Prepare temporary signing credentials
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: bash scripts/prepare-hosted-signing.sh
      - name: Sign, notarize and publish the exact CI app
        run: python3 scripts/release-app.py "$RUNNER_TEMP/prebuilt.noindex"
      - name: Remove temporary signing credentials
        if: always()
        run: |
          rm -f "${RELEASE_CERTIFICATE:-}" "${RELEASE_SPARKLE_KEY:-}"
          if [[ -n "${RELEASE_KEYCHAIN:-}" && -f "$RELEASE_KEYCHAIN" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN"
          fi
